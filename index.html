<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kanavu — Connecting Dreams</title>
<meta name="description" content="A cozy little world for two, across any distance." />
<meta name="theme-color" content="#2a1215" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kanavu" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;color:#f4e8d8;background:#1a0e12;user-select:none;-webkit-user-select:none}
#title-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,#3d1f24 0%,#2a1215 50%,#1a0e12 100%);transition:opacity .8s ease}
#title-screen.hidden{opacity:0;pointer-events:none}
.candle-glow{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ffe9b8 0%,#f5c86e 35%,rgba(245,200,110,0) 70%);box-shadow:0 0 60px 20px rgba(245,200,110,.3);margin-bottom:28px;animation:flicker 3s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.05);opacity:1}}
h1.title{font-size:clamp(56px,14vw,110px);font-weight:400;letter-spacing:.12em;text-indent:.12em;line-height:1;background:linear-gradient(180deg,#fff8ec 20%,#f5d9a8 55%,#c8956a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:12px;font-size:clamp(14px,3vw,19px);letter-spacing:.4em;text-indent:.4em;color:rgba(244,232,216,.6);font-style:italic}
.btn{margin-top:44px;padding:15px 58px;font-family:inherit;font-size:18px;letter-spacing:.25em;text-indent:.25em;cursor:pointer;color:#2a1a12;background:linear-gradient(180deg,#ffe9b8,#f5c86e);border:none;border-radius:999px;box-shadow:0 0 30px rgba(245,200,110,.4),0 6px 18px rgba(0,0,0,.4);transition:transform .2s ease}
.btn:active{transform:scale(.96)}
.foot{position:absolute;bottom:24px;font-size:12px;letter-spacing:.2em;color:rgba(244,232,216,.35);font-style:italic}
#game-screen{position:fixed;inset:0;z-index:1;display:none}
#game-screen.visible{display:block}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<div id="title-screen">
  <div class="candle-glow"></div>
  <h1 class="title">Kanavu</h1>
  <div class="tagline">connecting dreams</div>
  <button class="btn" id="begin-btn">Begin</button>
  <div class="foot">a cozy world for two</div>
</div>
<div id="game-screen">
  <canvas id="world-canvas"></canvas>
</div>
<script src="world2d.js?v=1"></script>
<script>
(function(){
  var beginBtn = document.getElementById('begin-btn');
  var titleScreen = document.getElementById('title-screen');
  var gameScreen = document.getElementById('game-screen');
  var worldApi = null;
  beginBtn.addEventListener('click', function(){
    titleScreen.classList.add('hidden');
    gameScreen.classList.add('visible');
    setTimeout(function(){ titleScreen.style.display = 'none'; }, 900);
    if (!worldApi && window.KanavuWorld2D) {
      worldApi = KanavuWorld2D.init('world-canvas', {
        playerName: 'Adi',
        partnerName: 'Tara',
        partnerOnline: true
      });
      window.Kanavu2D = worldApi;
    }
  });
})();
</script>
</body>
</html>
