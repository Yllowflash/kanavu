<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanavu — Paused</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,#2a1a12 0%,#1a0e12 100%);color:#f4e8d8}
h1{font-size:clamp(40px,10vw,72px);font-weight:400;letter-spacing:.1em;margin-bottom:16px}
p{font-size:16px;letter-spacing:.15em;color:rgba(244,232,216,.5);font-style:italic}
.candle{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#ffe9b8 0%,rgba(245,200,110,0) 70%);margin-bottom:24px;animation:flicker 3s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.8}50%{opacity:1}}
</style>
</head>
<body>
<div class="candle"></div>
<h1>Kanavu</h1>
<p>taking a little nap — back soon</p>
</body>
</html>
