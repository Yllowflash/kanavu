<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kanavu — Connecting Dreams</title>
<meta name="description" content="A cozy little world for two, across any distance." />
<meta name="theme-color" content="#1a0e12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;color:#f4e8d8;background:#1a0e12;user-select:none;-webkit-user-select:none}
#title-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,#4a2a20 0%,#2a1a12 50%,#1a0e12 100%);transition:opacity .8s ease}
#title-screen.hidden{opacity:0;pointer-events:none}
.sun-glow{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#ffe9b8 0%,#f5a86e 40%,rgba(245,168,110,0) 70%);box-shadow:0 0 80px 30px rgba(245,168,110,.25);margin-bottom:28px;animation:glowPulse 4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
h1.title{font-size:clamp(56px,14vw,110px);font-weight:400;letter-spacing:.12em;text-indent:.12em;line-height:1;background:linear-gradient(180deg,#fff8ec 20%,#f5d9a8 55%,#e8956a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:12px;font-size:clamp(14px,3vw,19px);letter-spacing:.4em;text-indent:.4em;color:rgba(244,232,216,.6);font-style:italic}
.btn{margin-top:44px;padding:15px 58px;font-family:inherit;font-size:18px;letter-spacing:.25em;text-indent:.25em;cursor:pointer;color:#2a1a12;background:linear-gradient(180deg,#ffe9b8,#f5a86e);border:none;border-radius:999px;box-shadow:0 0 30px rgba(245,168,110,.4),0 6px 18px rgba(0,0,0,.4);transition:transform .2s ease}
.btn:active{transform:scale(.96)}
.foot{position:absolute;bottom:24px;font-size:12px;letter-spacing:.2em;color:rgba(244,232,216,.35);font-style:italic}
#game-screen{position:fixed;inset:0;z-index:1;display:none}
#game-screen.visible{display:block}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(26,14,18,.85);color:#f5d9a8;font-size:18px;letter-spacing:.2em}
#loading.visible{display:flex}
#mp-btn{position:fixed;top:14px;right:14px;z-index:50;display:none;padding:10px 18px;border:1px solid rgba(245,200,110,.4);border-radius:999px;background:rgba(26,14,18,.65);color:#f5d9a8;font-family:inherit;font-size:14px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(6px)}
#mp-btn.visible{display:block}
#mp-btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:7px;vertical-align:1px}
#mp-btn .dot.on{background:#a8e6a1;box-shadow:0 0 8px #a8e6a1}
</style>
</head>
<body>
<div id="title-screen">
  <div class="sun-glow"></div>
  <h1 class="title">Kanavu</h1>
  <div class="tagline">connecting dreams</div>
  <button class="btn" id="begin-btn">Begin</button>
  <div class="foot">a cozy world for two</div>
</div>
<div id="loading">loading the islands...</div>
<div id="game-screen">
  <canvas id="world-canvas"></canvas>
</div>
<button id="mp-btn"><span class="dot" id="mp-dot"></span><span id="mp-label">Walk Together</span></button>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="kanavu-world.js?v=2"></script>
<script src="kanavu-multiplayer.js?v=1"></script>
<script>
(function(){
  var beginBtn = document.getElementById('begin-btn');
  var titleScreen = document.getElementById('title-screen');
  var gameScreen = document.getElementById('game-screen');
  var loading = document.getElementById('loading');
  var mpBtn = document.getElementById('mp-btn');
  var mpDot = document.getElementById('mp-dot');
  var mpLabel = document.getElementById('mp-label');
  var started = false;
  var worldApi = null, mp = null;
  beginBtn.addEventListener('click', function(){
    if (started) return;
    started = true;
    titleScreen.classList.add('hidden');
    loading.classList.add('visible');
    setTimeout(function(){ titleScreen.style.display = 'none'; }, 900);
    // Let the loading screen paint before heavy init
    setTimeout(function(){
      try {
        if (window.KanavuWorld) {
          worldApi = KanavuWorld.init('world-canvas', {});
          window.KanavuWorldApi = worldApi; // for console/debug
          gameScreen.classList.add('visible');
          loading.classList.remove('visible');
          mpBtn.classList.add('visible');
          // Init multiplayer (graceful if Supabase fails)
          try {
            if (window.KanavuMultiplayer) {
              var savedName = '';
              try { savedName = localStorage.getItem('kanavu_player_name') || ''; } catch (e) {}
              mp = KanavuMultiplayer.init(worldApi, { playerName: savedName || 'Player' });
              window.KanavuMP = mp;
              mp.onPresence(function (p) {
                mpDot.className = 'dot' + (p.online ? ' on' : '');
                mpLabel.textContent = p.online ? ('With ' + (p.name || 'partner')) : 'Walk Together';
              });
              // Persist name changes
              var origShow = mp.showUI.bind(mp);
              mp.showUI = function () {
                origShow();
                var iv = setInterval(function () {
                  var inp = document.getElementById('kvmp-name');
                  if (inp) {
                    clearInterval(iv);
                    inp.addEventListener('change', function () {
                      try { localStorage.setItem('kanavu_player_name', inp.value.trim()); } catch (e) {}
                    });
                  } else if (!document.getElementById('kv-mp-ui')) clearInterval(iv);
                }, 300);
              };
            }
          } catch (mpErr) { console.warn('[mp] init failed, solo mode:', mpErr); }
        } else {
          loading.textContent = 'failed to load — please reload';
        }
      } catch(e) {
        loading.textContent = 'something went wrong — please reload';
      }
    }, 100);
  });
  mpBtn.addEventListener('click', function () {
    if (mp) mp.showUI();
    else alert('Multiplayer is not available right now.');
  });
})();
</script>
</body>
</html>
