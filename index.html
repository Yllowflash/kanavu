<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kanavu — Connecting Dreams</title>
<meta name="description" content="A cozy little world for two, across any distance." />
<meta name="theme-color" content="#1a0e12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;color:#f4e8d8;background:#1a0e12;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,#4a2a20 0%,#2a1a12 50%,#1a0e12 100%);transition:opacity .8s ease;padding:24px}
.screen.hidden{opacity:0;pointer-events:none}
.screen.gone{display:none}
.sun-glow{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#ffe9b8 0%,#f5a86e 40%,rgba(245,168,110,0) 70%);box-shadow:0 0 80px 30px rgba(245,168,110,.25);margin-bottom:28px;animation:glowPulse 4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
h1.title{font-size:clamp(56px,14vw,110px);font-weight:400;letter-spacing:.12em;text-indent:.12em;line-height:1;background:linear-gradient(180deg,#fff8ec 20%,#f5d9a8 55%,#e8956a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:12px;font-size:clamp(14px,3vw,19px);letter-spacing:.4em;text-indent:.4em;color:rgba(244,232,216,.6);font-style:italic}
.btn{margin-top:26px;padding:15px 52px;font-family:inherit;font-size:18px;letter-spacing:.25em;text-indent:.25em;cursor:pointer;color:#2a1a12;background:linear-gradient(180deg,#ffe9b8,#f5a86e);border:none;border-radius:999px;box-shadow:0 0 30px rgba(245,168,110,.4),0 6px 18px rgba(0,0,0,.4);transition:transform .2s ease}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:#f5d9a8;border:1px solid rgba(245,200,110,.45);box-shadow:none;font-size:15px;padding:12px 40px}
.foot{position:absolute;bottom:24px;font-size:12px;letter-spacing:.2em;color:rgba(244,232,216,.35);font-style:italic}
.card{background:linear-gradient(180deg,rgba(58,33,38,.96),rgba(36,19,24,.96));border:1px solid rgba(245,200,110,.35);border-radius:20px;padding:30px 32px;max-width:380px;width:100%;box-shadow:0 16px 60px rgba(0,0,0,.55)}
.card h2{font-size:22px;letter-spacing:.14em;margin-bottom:6px;color:#ffe9b8;font-weight:400}
.card .sub{font-size:13px;color:rgba(244,232,216,.55);font-style:italic;margin-bottom:20px}
.field{width:100%;padding:12px 16px;margin-bottom:12px;border-radius:12px;border:1px solid rgba(245,200,110,.3);background:rgba(0,0,0,.32);color:#f4e8d8;font-family:inherit;font-size:15px;outline:none}
.field:focus{border-color:rgba(245,200,110,.7)}
.err{font-size:13px;color:#e6a1a1;min-height:20px;margin:6px 0}
.role-pick{display:flex;gap:10px;justify-content:center;margin:6px 0 16px}
.role-pick button{flex:1;padding:12px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;border:1px solid rgba(245,200,110,.3);background:transparent;color:#f5d9a8}
.role-pick button.sel{background:linear-gradient(180deg,#ffe9b8,#f5a86e);color:#2a1a12;border:none;font-weight:bold}
.code-big{font-size:38px;letter-spacing:.25em;font-weight:bold;color:#ffe9b8;margin:12px 0}
#game-screen{position:fixed;inset:0;z-index:1;display:none}
#game-screen.visible{display:block}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#loading{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(26,14,18,.85);color:#f5d9a8;font-size:18px;letter-spacing:.2em}
#loading.visible{display:flex}
#sound-btn{position:fixed;top:14px;left:14px;z-index:50;display:none;width:44px;height:44px;border-radius:50%;border:2px solid rgba(245,200,110,.85);background:rgba(26,14,18,.85);color:#f5d9a8;font-size:19px;cursor:pointer;backdrop-filter:blur(6px)}
#set-btn{position:fixed;top:14px;left:66px;z-index:50;display:none;width:44px;height:44px;border-radius:50%;border:2px solid rgba(245,200,110,.85);background:rgba(26,14,18,.85);color:#f5d9a8;font-size:19px;cursor:pointer;backdrop-filter:blur(6px)}
#set-panel{position:fixed;z-index:60;top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,88vw);max-height:82vh;overflow-y:auto;background:rgba(30,16,22,.96);border:1px solid rgba(245,200,110,.35);border-radius:18px;padding:20px;color:#f4e8d8;display:none;backdrop-filter:blur(10px)}
#set-panel.visible{display:block}
#set-panel h3{margin:0 0 14px;text-align:center;letter-spacing:.15em;color:#ffe9b8;font-size:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:8px}
.set-lbl{font-size:14px;color:rgba(244,232,216,.85);min-width:70px}
.set-opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.set-opt{border:1px solid rgba(245,200,110,.35);background:rgba(60,30,40,.5);color:#f4e8d8;border-radius:12px;padding:7px 10px;font-size:13px;cursor:pointer}
.set-opt.sel{background:linear-gradient(180deg,#ffe9b8,#f5a86e);color:#2a1a12;border:none;font-weight:bold}
#set-close{width:100%;margin-top:12px}
</style>
</head>
<body>
<div class="screen" id="title-screen">
  <div class="sun-glow"></div>
  <h1 class="title">Kanavu</h1>
  <div class="tagline">connecting dreams</div>
  <button class="btn" id="begin-btn">Begin</button>
  <div class="foot">a cozy world for two</div>
</div>

<div class="screen gone" id="auth-screen">
  <div class="card">
    <h2>WELCOME BACK</h2>
    <div class="sub">sign in, or wander in as a guest</div>
    <input class="field" id="auth-name" placeholder="Your name" maxlength="24" />
    <input class="field" id="auth-email" type="email" placeholder="Email" autocomplete="email" />
    <input class="field" id="auth-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="signup-extra" style="display:none;">
      <input class="field" id="auth-age" type="number" placeholder="Your age" min="13" max="120" />
      <input class="field" id="auth-anniversary" type="date" placeholder="Anniversary date" max="" />
      <div style="font-size:12px;color:rgba(244,232,216,.6);margin:-6px 0 8px;text-align:left;">💛 when did your story begin? (powers your countdown)</div>
    </div>
    <div class="err" id="auth-err"></div>
    <button class="btn" id="signin-btn" style="width:100%;margin-top:6px">Sign in</button>
    <button class="btn ghost" id="signup-btn" style="width:100%">Create account</button>
    <button class="btn ghost" id="forgot-btn" style="width:100%;border:none;font-size:13px;">Forgot password?</button>
    <button class="btn ghost" id="guest-btn" style="width:100%;border:none">Continue as guest →</button>
  </div>
</div>

<div class="screen gone" id="invite-screen">
  <div class="card">
    <h2>WALK TOGETHER</h2>
    <div class="sub">invite-only · just the two of you</div>
    <div id="invite-main">
      <div style="font-size:14px;margin-bottom:8px;color:rgba(244,232,216,.7)">I am playing as…</div>
      <div class="role-pick" id="role-pick">
        <button data-role="boy" class="sel">🧑 The Boy</button>
        <button data-role="girl">👧 The Girl</button>
      </div>
      <button class="btn" id="create-btn" style="width:100%">Create invite code</button>
      <button class="btn ghost" id="join-toggle" style="width:100%">Enter a code instead</button>
      <div id="reconnect-row"></div>
    </div>
    <div id="invite-pane" style="display:none"></div>
  </div>
</div>

<div id="loading">loading the islands...</div>
<div id="game-screen">
  <canvas id="world-canvas"></canvas>
</div>
<button id="sound-btn" title="sound on/off">♪</button>
<button id="set-btn" title="settings">⚙️</button>
<div id="set-panel">
  <h3>SETTINGS</h3>
  <div class="set-row">
    <span class="set-lbl">🕐 Time</span>
    <div class="set-opts" id="set-time">
      <button class="set-opt sel" data-v="auto">Auto</button>
      <button class="set-opt" data-v="morning">🌅 Morning</button>
      <button class="set-opt" data-v="night">🌙 Night</button>
    </div>
  </div>
  <div class="set-row">
    <span class="set-lbl">🌦️ Weather</span>
    <div class="set-opts" id="set-weather">
      <button class="set-opt sel" data-v="clear">☀️ Clear</button>
      <button class="set-opt" data-v="rain">🌧️ Rain</button>
      <button class="set-opt" data-v="snow">❄️ Snow</button>
    </div>
  </div>
  <div class="set-row">
    <span class="set-lbl">🔊 Sound</span>
    <div class="set-opts" id="set-sound">
      <button class="set-opt sel" data-v="on">On</button>
      <button class="set-opt" data-v="off">Off</button>
    </div>
  </div>
  <div class="set-row">
    <span class="set-lbl">👕 Outfit</span>
    <div class="set-opts" id="set-outfit" style="flex-wrap:wrap;gap:8px;">
      <!-- M6: free outfit colors; shop sells exclusives -->
    </div>
  </div>
  <div class="set-row">
    <span class="set-lbl">💛 Anniversary</span>
    <div style="flex:1;">
      <input type="date" id="set-anniversary" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(245,200,110,.3);background:rgba(0,0,0,.3);color:#f4e8d8;font-family:inherit;" />
    </div>
  </div>
  <button class="btn" id="set-close">Close ✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="kanavu-world.js?v=11"></script>
<script src="kanavu-multiplayer.js?v=2"></script>
<script src="kanavu-music.js?v=2"></script>
<script src="kanavu-ambience.js?v=1"></script>
<script src="kanavu-social.js?v=3"></script>
<script>
(function(){
  'use strict';
  var SUPABASE_URL = 'https://ersejxowxutsefalyjaf.supabase.co';
  var ANON_KEY = 'sb_publishable_lGEyfvUYZqa5B5l5uwNizQ_APQcmK8i';

  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).classList.remove('gone'); requestAnimationFrame(function(){ $(id).classList.remove('hidden'); }); }
  function hide(id){ $(id).classList.add('hidden'); setTimeout(function(){ $(id).classList.add('gone'); }, 850); }

  var titleScreen = $('title-screen'), authScreen = $('auth-screen'), inviteScreen = $('invite-screen');
  var gameScreen = $('game-screen'), loading = $('loading'), soundBtn = $('sound-btn');

  var sbAuth = null, mp = null, worldApi = null;
  var myName = '', myRole = 'boy', authed = false;

  try { sbAuth = window.supabase.createClient(SUPABASE_URL, ANON_KEY); } catch (e) {}

  /* ---------- title -> auth ---------- */
  $('begin-btn').addEventListener('click', function(){
    hide('title-screen');
    // skip auth if a session already exists
    if (sbAuth) {
      sbAuth.auth.getSession().then(function(res){
        var sess = res && res.data && res.data.session;
        if (sess && sess.user) {
          authed = true;
          myName = (sess.user.user_metadata && sess.user.user_metadata.name) || sess.user.email.split('@')[0];
          try { localStorage.setItem('kanavu_player_name', myName); } catch(e){}
          showInvite();
        } else show('auth-screen');
      }).catch(function(){ show('auth-screen'); });
    } else show('auth-screen');
  });

  /* ---------- auth ---------- */
  function authErr(msg){ $('auth-err').textContent = msg || ''; }
  function readName(){
    var v = $('auth-name').value.trim();
    if (v) { myName = v; try { localStorage.setItem('kanavu_player_name', v); } catch(e){} }
    else if (!myName) { try { myName = localStorage.getItem('kanavu_player_name') || ''; } catch(e){} }
    return myName;
  }
  $('signin-btn').addEventListener('click', function(){
    authErr('');
    var email = $('auth-email').value.trim(), pass = $('auth-pass').value;
    readName();
    if (!email || !pass) { authErr('Enter your email and password.'); return; }
    authErr('Signing in…');
    sbAuth.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
      if (res.error) { authErr(friendlyAuthErr(res.error.message)); return; }
      authed = true;
      var u = res.data.user;
      if (!myName) myName = (u.user_metadata && u.user_metadata.name) || email.split('@')[0];
      if ($('auth-name').value.trim()) { try { sbAuth.auth.updateUser({ data: { name: myName } }); } catch(e){} }
      showInvite();
    }).catch(function(err){ authErr(err.message || 'Sign-in failed.'); });
  });
  // M6: set max anniversary to today (cannot be in the future)
  try { $('auth-anniversary').max = new Date().toISOString().slice(0, 10); } catch (e) {}
  // M6: friendly branded auth errors (never raw dumps)
  function friendlyAuthErr(msg) {
    var m = String(msg || '');
    if (/invalid login credentials/i.test(m)) return 'Hmm, that email + password don\'t match. Try again? 💛';
    if (/user already registered/i.test(m)) return 'You already have an account — try signing in instead 💛';
    if (/password.*6 characters/i.test(m)) return 'Password needs at least 6 characters.';
    if (/invalid email/i.test(m)) return 'That email doesn\'t look quite right — check it? 💛';
    if (/rate limit/i.test(m)) return 'Whoa, slow down! Try again in a minute 💛';
    return m || 'Something went sideways — try again? 💛';
  }
  // M6: forgot password flow
  $('forgot-btn').addEventListener('click', function(){
    authErr('');
    var email = $('auth-email').value.trim();
    if (!email) { authErr('Enter your email above, then tap "Forgot password?" 💛'); return; }
    authErr('Sending a reset link…');
    sbAuth.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname + '#reset'
    }).then(function(res){
      if (res.error) { authErr(friendlyAuthErr(res.error.message)); return; }
      authErr('');
      // Show a friendly confirmation
      var card = document.querySelector('#auth-screen .card');
      if (card) {
        card.innerHTML = '<h2>CHECK YOUR EMAIL 💌</h2>' +
          '<div class="sub">we sent a reset link to<br><b>' + email.replace(/</g, '&lt;') + '</b></div>' +
          '<div style="font-size:14px;color:rgba(244,232,216,.7);margin:16px 0;line-height:1.5;">' +
          'Tap the link in the email to pick a new password.<br>Didn\'t get it? Check spam, then try again.</div>' +
          '<button class="btn ghost" id="back-to-auth" style="width:100%">← back to sign in</button>';
        $('back-to-auth').addEventListener('click', function(){ location.reload(); });
      }
    }).catch(function(err){ authErr(friendlyAuthErr(err.message)); });
  });
  // M6: handle password reset callback (#reset)
  if (location.hash === '#reset') {
    // Supabase will handle the token; show a new-password form
    setTimeout(function(){
      var card = document.querySelector('#auth-screen .card');
      if (card && sbAuth) {
        card.innerHTML = '<h2>NEW PASSWORD</h2>' +
          '<div class="sub">pick something you\'ll remember 💛</div>' +
          '<input class="field" id="new-pass" type="password" placeholder="New password" />' +
          '<div class="err" id="reset-err"></div>' +
          '<button class="btn" id="reset-btn" style="width:100%">Save new password</button>';
        $('reset-btn').addEventListener('click', function(){
          var np = $('new-pass').value;
          if (!np || np.length < 6) { $('reset-err').textContent = 'Password needs at least 6 characters.'; return; }
          sbAuth.auth.updateUser({ password: np }).then(function(res){
            if (res.error) { $('reset-err').textContent = friendlyAuthErr(res.error.message); return; }
            card.innerHTML = '<h2>ALL SET! 🎉</h2><div class="sub">your password is updated</div>' +
              '<button class="btn" id="reset-done" style="width:100%;margin-top:12px;">Continue →</button>';
            $('reset-done').addEventListener('click', function(){ location.hash = ''; location.reload(); });
          });
        });
      }
    }, 500);
  }
  var signupMode = false;
  $('signup-btn').addEventListener('click', function(){
    if (!signupMode) {
      // First click: reveal the extra fields
      signupMode = true;
      $('signup-extra').style.display = 'block';
      $('signin-btn').style.display = 'none';
      $('forgot-btn').style.display = 'none';
      $('signup-btn').textContent = 'Create my account →';
      return;
    }
    authErr('');
    var email = $('auth-email').value.trim(), pass = $('auth-pass').value;
    readName();
    if (!email || !pass) { authErr('Enter an email and a password.'); return; }
    if (pass.length < 6) { authErr('Password needs at least 6 characters.'); return; }
    // M6: anniversary + age
    var ageVal = $('auth-age').value.trim();
    var annVal = $('auth-anniversary').value;
    var age = ageVal ? parseInt(ageVal, 10) : null;
    if (ageVal && (isNaN(age) || age < 13 || age > 120)) { authErr('Please enter a valid age (13+).'); return; }
    if (annVal) {
      var annDate = new Date(annVal + 'T12:00:00');
      var today = new Date(); today.setHours(0, 0, 0, 0);
      if (annDate > today) { authErr('Your anniversary can\'t be in the future 💛'); return; }
    }
    authErr('Creating your account…');
    var meta = { name: myName || email.split('@')[0] };
    if (age) meta.age = age;
    if (annVal) meta.anniversary = annVal;
    // M6: also save locally for the countdown
    try {
      if (age) localStorage.setItem('kanavu_age', String(age));
      if (annVal) localStorage.setItem('kanavu_anniversary', annVal);
    } catch (e) {}
    sbAuth.auth.signUp({ email: email, password: pass, options: { data: meta } }).then(function(res){
      if (res.error) { authErr(friendlyAuthErr(res.error.message)); return; }
      authed = true;
      if (!myName) myName = email.split('@')[0];
      authErr('');
      showInvite();
    }).catch(function(err){ authErr(err.message || 'Sign-up failed.'); });
  });
  $('guest-btn').addEventListener('click', function(){
    readName();
    if (!myName) myName = 'Guest';
    showInvite();
  });
  function showInvite(){
    hide('auth-screen');
    show('invite-screen');
    buildInvite();
  }

  /* ---------- invite ---------- */
  var roleBtns = document.querySelectorAll('#role-pick button');
  roleBtns.forEach(function(b){
    b.addEventListener('click', function(){
      roleBtns.forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
      myRole = b.getAttribute('data-role');
      if (mp) mp.setMyRole(myRole);
    });
  });
  function stubWorld(){
    return {
      getPlayerPos: function(){ return {x:0,y:0,z:0}; },
      getPlayerAnim: function(){ return {moving:false,sitting:false,yaw:0}; },
      setPartnerRemote: function(){}, setPartnerNet: function(){}, setPartnerOnline: function(){}
    };
  }
  function ensureMp(){
    if (mp) return mp;
    mp = window.KanavuMultiplayer.init(stubWorld(), { playerName: myName || 'Player', myRole: myRole });
    window.KanavuMP = mp;
    return mp;
  }
  function pane(html){
    $('invite-main').style.display = 'none';
    var p = $('invite-pane'); p.style.display = 'block'; p.innerHTML = html;
  }
  function buildInvite(){
    var row = $('reconnect-row'); row.innerHTML = '';
    try {
      var m = ensureMp(), saved = m.getSavedPair();
      if (saved && saved.pairId) {
        var b = document.createElement('button');
        b.className = 'btn ghost'; b.style.width = '100%';
        b.textContent = 'Reconnect to ' + (saved.partnerName || 'partner');
        b.addEventListener('click', function(){
          pane('<div style="font-size:14px;">Reconnecting…</div>');
          m.reconnectSaved().then(function(r){
            enterGame(r.myRole || 'boy', r.partnerName);
          }).catch(function(err){ pane('<div class="err">' + err.message + '</div>'); });
        });
        row.appendChild(b);
      }
    } catch(e){}
  }
  $('create-btn').addEventListener('click', function(){
    var m = ensureMp();
    m.setMyRole(myRole);
    pane('<div style="font-size:14px;">Creating your invite code…</div>');
    m.generateCode().then(function(code){
      pane(
        '<div class="sub">share this with your partner (24 hours)</div>' +
        '<div class="code-big">' + code + '</div>' +
        '<button class="btn ghost" id="copy-code" style="width:100%">Copy code</button>' +
        '<div style="font-size:13px;margin:14px 0;color:rgba(244,232,216,.55)" id="wait-note">Waiting for partner… you can head in now.</div>' +
        '<button class="btn" id="enter-now" style="width:100%">Enter the islands</button>' +
        '<div style="margin-top:10px"><a href="#" id="change-role" style="color:rgba(245,200,110,.7);font-size:13px;text-decoration:underline">← change role</a></div>'
      );
      $('change-role').addEventListener('click', function(e){
        e.preventDefault();
        clearInterval(iv);
        $('invite-pane').style.display = 'none';
        $('invite-main').style.display = 'block';
      });
      $('copy-code').addEventListener('click', function(){
        try { if (navigator.clipboard) navigator.clipboard.writeText(code); this.textContent = 'Copied!'; }
        catch(e){ this.textContent = code; }
      });
      $('enter-now').addEventListener('click', function(){ enterGame(myRole, null); });
      var iv = setInterval(function(){
        if (m.getPairId()) {
          clearInterval(iv);
          var w = $('wait-note');
          if (w) { w.innerHTML = '<span style="color:#a8e6a1">Partner joined! Heading in…</span>'; }
          setTimeout(function(){ enterGame(myRole, m.getPartner().name); }, 1200);
        }
        if (!$('invite-pane').isConnected) clearInterval(iv);
      }, 800);
    }).catch(function(err){ pane('<div class="err">' + err.message + '</div>'); });
  });
  $('join-toggle').addEventListener('click', function(){
    pane(
      '<div class="sub">enter your partner\'s code</div>' +
      '<input class="field" id="join-code" placeholder="KAN-XXX" maxlength="7" ' +
      'style="text-transform:uppercase;text-align:center;letter-spacing:.2em;font-size:20px;" />' +
      '<div class="err" id="join-err"></div>' +
      '<button class="btn" id="join-go" style="width:100%">Join</button>'
    );
    var inp = $('join-code'); inp.focus();
    function go(){
      var c = inp.value.trim().toUpperCase();
      var m = ensureMp();
      $('join-err').textContent = 'Connecting…';
      m.joinCode(c).then(function(r){
        enterGame(r.myRole || 'girl', r.partnerName);
      }).catch(function(err){ $('join-err').textContent = err.message; });
    }
    $('join-go').addEventListener('click', go);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); e.stopPropagation(); });
  });

  /* ---------- enter the world ---------- */
  var entered = false;
  function enterGame(role, partnerName){
    if (entered) return; entered = true;
    hide('invite-screen');
    loading.classList.add('visible');
    setTimeout(function(){
      try {
        worldApi = window.KanavuWorld.init('world-canvas', {
          role: role, playerName: myName || 'Player', partnerName: partnerName || 'Tara'
        });
        window.KanavuWorldApi = worldApi;
        if (mp) mp.setWorldApi(worldApi);
        if (window.KanavuSocial) window.KanavuSocial.init(worldApi, mp);
        gameScreen.classList.add('visible');
        loading.classList.remove('visible');
        soundBtn.style.display = 'block';
        $('set-btn').style.display = 'block';
        try {
          if (window.KanavuMusic) KanavuMusic.start();
          if (window.KanavuAmbience) KanavuAmbience.start();
        } catch (sndErr) {}
        // let the partner know we're here
        try { if (mp) mp.sendMsg('notify', { kind: 'login', text: '💛 ' + (myName || 'Your partner') + ' is here' }); } catch(e){}
      } catch(e) {
        loading.textContent = 'something went wrong — please reload';
      }
    }, 120);
  }

  /* ---------- sound toggle ---------- */
  var soundOn = true;
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    try {
      if (window.KanavuMusic) { if (soundOn) KanavuMusic.start(); else KanavuMusic.stop(); }
      if (window.KanavuAmbience) { if (soundOn) KanavuAmbience.start(); else KanavuAmbience.stop(); }
    } catch(e){}
    soundBtn.textContent = soundOn ? '♪' : '✕';
    soundBtn.style.opacity = soundOn ? '1' : '.45';
  });

  /* ---------- settings panel (time + weather + sound) ---------- */
  var setPanel = $('set-panel');
  $('set-btn').addEventListener('click', function(){ setPanel.classList.add('visible'); });
  $('set-close').addEventListener('click', function(){ setPanel.classList.remove('visible'); });
  function setOptSel(groupId, v) {
    var btns = $(groupId).querySelectorAll('.set-opt');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('sel', btns[i].getAttribute('data-v') === v);
  }
  $('set-time').addEventListener('click', function(e){
    var b = e.target.closest('.set-opt'); if (!b || !worldApi) return;
    var v = b.getAttribute('data-v');
    setOptSel('set-time', v);
    try { worldApi.setTimeOfDay(v === 'morning' ? 8 : v === 'night' ? 0 : null); } catch(err){}
  });
  $('set-weather').addEventListener('click', function(e){
    var b = e.target.closest('.set-opt'); if (!b || !worldApi) return;
    var v = b.getAttribute('data-v');
    setOptSel('set-weather', v);
    try { worldApi.setWeather(v); } catch(err){}
  });
  $('set-sound').addEventListener('click', function(e){
    var b = e.target.closest('.set-opt'); if (!b) return;
    var v = b.getAttribute('data-v');
    setOptSel('set-sound', v);
    if ((v === 'off') === soundOn) soundBtn.click();
  });
  /* M6: outfit colors (free base customization; shop sells exclusives) */
  var OUTFIT_COLORS = [
    { id: 'olive', name: 'Olive', c: '#6d7f3c' },
    { id: 'salmon', name: 'Salmon', c: '#e89a90' },
    { id: 'sky', name: 'Sky', c: '#7fb3d5' },
    { id: 'lavender', name: 'Lavender', c: '#b8a9d9' },
    { id: 'rose', name: 'Rose', c: '#d98880' },
    { id: 'mint', name: 'Mint', c: '#82c99a' }
  ];
  var outfitWrap = $('set-outfit');
  var currentOutfit = 'olive';
  try { currentOutfit = localStorage.getItem('kanavu_outfit') || 'olive'; } catch (e) {}
  OUTFIT_COLORS.forEach(function (oc) {
    var b = document.createElement('button');
    b.className = 'set-opt' + (oc.id === currentOutfit ? ' sel' : '');
    b.setAttribute('data-v', oc.id);
    b.title = oc.name;
    b.style.cssText = 'width:36px;height:36px;border-radius:50%;background:' + oc.c + ';border:2px solid rgba(245,200,110,.4);cursor:pointer;padding:0;';
    b.addEventListener('click', function(){
      currentOutfit = oc.id;
      try { localStorage.setItem('kanavu_outfit', oc.id); } catch (e) {}
      setOptSel('set-outfit', oc.id);
      try { if (worldApi && worldApi.setOutfitColor) worldApi.setOutfitColor(oc.c); } catch (err) {}
    });
    outfitWrap.appendChild(b);
  });
  /* M6: anniversary (editable; powers countdown) */
  var annInput = $('set-anniversary');
  try {
    annInput.max = new Date().toISOString().slice(0, 10);
    annInput.value = localStorage.getItem('kanavu_anniversary') || '';
  } catch (e) {}
  annInput.addEventListener('change', function(){
    var v = annInput.value;
    if (v) {
      var d = new Date(v + 'T12:00:00');
      var today = new Date(); today.setHours(0, 0, 0, 0);
      if (d > today) { annInput.value = localStorage.getItem('kanavu_anniversary') || ''; return; }
    }
    try {
      if (v) localStorage.setItem('kanavu_anniversary', v);
      else localStorage.removeItem('kanavu_anniversary');
    } catch (e) {}
  });
})();
/* M2: service worker + soft notification nudges */
(function(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    // Ask for notification permission gently (only once)
    try {
      var asked = localStorage.getItem('kanavu-notif-asked');
      if (!asked && 'Notification' in window && Notification.permission === 'default') {
        localStorage.setItem('kanavu-notif-asked', '1');
        setTimeout(function(){
          if (confirm('💛 Kanavu can send you sweet nudges (like "a gift arrived"). Allow?')) {
            Notification.requestPermission();
          }
        }, 8000);
      }
    } catch(e){}
    // Soft nudges: check once per hour, respect quiet hours (10pm-8am)
    function quietHours() {
      var h = new Date().getHours();
      return h >= 22 || h < 8;
    }
    function nudge(title, body, tag) {
      if (quietHours()) return;
      try {
        var last = localStorage.getItem('kanavu-nudge-' + tag);
        var today = new Date().toISOString().slice(0,10);
        if (last === today) return; // one nudge per event per day
        localStorage.setItem('kanavu-nudge-' + tag, today);
        if (reg.active) {
          reg.active.postMessage({ type: 'notify', title: title, body: body, tag: tag });
        } else if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, { body: body });
        }
      } catch(e){}
    }
    // Nudge: beacon not lit today (evening reminder)
    setInterval(function(){
      try {
        var beaconLit = localStorage.getItem('kanavu-beacon-lit');
        var lit = false;
        if (beaconLit) {
          var d = JSON.parse(beaconLit);
          lit = d.date === new Date().toISOString().slice(0,10) && d.lit;
        }
        if (!lit && new Date().getHours() >= 19) {
          nudge('Kanavu 💛', 'the beacon is waiting 🔥', 'beacon');
        }
      } catch(e){}
    }, 3600000);
    // Expose for the social layer (gift arrived, etc.)
    window.KanavuNudge = { nudge: nudge };
  }).catch(function(){});
})();
</script>
